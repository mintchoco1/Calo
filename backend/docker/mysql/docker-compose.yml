services:
  mysql:
    image: mysql:8.0
    container_name: calorie-tracker-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
      MYSQL_DATABASE: calorie_tracker
      MYSQL_USER: app
      MYSQL_PASSWORD: apppw
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data: